name: Cache flake outputs

on:
  push:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: cache-flake-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-cache:
    runs-on: native
    env:
      ATTIC_ENDPOINT: https://cache.akhlus.uk/
      ATTIC_CACHE: dendrix
      ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
      GIT_SSH_COMMAND: "ssh -i $HOME/.ssh/git -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH for private flake inputs
        run: |
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "${{ secrets.GIT_SSH_KEY }}" > "$HOME/.ssh/git"
          chmod 600 "$HOME/.ssh/git"
          ssh-keyscan -p 2222 git-ssh.akhlus.uk >> "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Update flake lock
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: nix flake update

      - name: Configure Attic
        run: |
          token="$(printf '%s' "$ATTIC_TOKEN" | tr -d '\r\n')"
          test -n "$token"

          attic login --set-default "$ATTIC_CACHE" "$ATTIC_ENDPOINT" "$token"

      - name: Build and Cache Linux packages and systems
        run: |
          nix run github:mic92/nix-fast-build -- \
            --flake .#packages \
            --systems "x86_64-linux aarch64-linux" \
            --skip-cached \
            --attic-cache "$ATTIC_CACHE"

      - name: Update README services table
        run: |
          bash scripts/update-services-readme.sh
          if ! git diff --quiet -- README.md; then
            git config user.name "forgejo-actions"
            git config user.email "forgejo-actions@akhlus.uk"
            git add README.md
            git commit -m "chore: sync README services table"
            git push
          fi

      - name: Commit updated lock file
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          set -eu

          if git diff --quiet -- flake.lock; then
            exit 0
          fi

          git config user.name "forgejo-actions"
          git config user.email "forgejo-actions@akhlus.uk"
          git add flake.lock
          git commit -m "chore: update flake lock"
          git push

      - name: Send ntfy notification
        if: always()
        run: |
          status="${{ job.status }}"

          if [ "$status" = "success" ]; then
            title="Dendrix Cache Success"
            priority="default"
            tags="package,white_check_mark"
            body="Successfully built, cached, and updated lock files for dendrix"
          else
            title="Dendrix Cache Failed"
            priority="high"
            tags="warning,x"
            body="Dendrix build and cache failed"
          fi

          curl \
            -H "Title: $title" \
            -H "Priority: $priority" \
            -H "Tags: $tags" \
            -H "Click: $run_url" \
            -d "$body" \
            "${{secrets.NTFY_URL}}"
