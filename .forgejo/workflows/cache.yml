name: Cache flake outputs

on:
  push:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

concurrency:
  group: cache-flake-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-cache:
    runs-on: native
    env:
      ATTIC_ENDPOINT: https://cache.akhlus.uk
      ATTIC_CACHE: dendrix
      ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
      GIT_SSH_COMMAND: "ssh -i $HOME/.ssh/git -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print Nix config
        run: |
            nix config show

      - name: Configure SSH for private flake inputs
        run: |
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "${{ secrets.GIT_SSH_KEY }}" > "$HOME/.ssh/git"
          chmod 600 "$HOME/.ssh/git"
          ssh-keyscan -p 2222 git-ssh.akhlus.uk >> "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Update flake lock
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: nix flake update

      - name: Configure Attic
        run: |
          token="$(printf '%s' "$ATTIC_TOKEN" | tr -d '\r\n')"
          test -n "$token"

          attic login --set-default dendrix "$ATTIC_ENDPOINT" "$token"
          attic cache configure --public --retention-period "3 days" "$ATTIC_CACHE"

      - name: Build and push all flake packages
        run: |
          set -eu

          nix flake show --json --all-systems \
            | jq -r '
              .packages // {}
              | to_entries[]
              | .key as $system
              | select($system | endswith("-linux"))
              | .value
              | to_entries[]
              | select(.value.type == "derivation")
              | "\($system) \(.key)"
            ' > packages.txt

          if [ ! -s packages.txt ]; then
            echo "no packages"
            exit 0
          fi

          while read -r system package; do
            echo "building package $package for $system"
            out="$(
              nix build \
                --accept-flake-config \
                --print-build-logs \
                --no-link \
                --print-out-paths \
                ".#packages.${system}.${package}"
            )"
          done < packages.txt

      - name: Build and push all NixOS configurations
        run: |
          set -eu

          configs="$(
            nix eval --json .#nixosConfigurations --apply builtins.attrNames \
              | jq -r '.[]'
          )"

          for host in $configs; do
            echo "building $host"
            out="$(
              nix build \
                --print-build-logs \
                --no-link \
                --print-out-paths \
                ".#nixosConfigurations.${host}.config.system.build.toplevel"
            )"
          done

      - name: Push paths to attic
        run: |
          find /nix/store -mindepth 1 -maxdepth 1 -type d -not -name '.*' -exec attic push $ATTIC_CACHE {} \;
          echo "Cached all paths successfully!"

      - name: Commit updated lock file
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          set -eu

          if git diff --quiet -- flake.lock; then
            exit 0
          fi

          git config user.name "forgejo-actions"
          git config user.email "forgejo-actions@akhlus.uk"
          git add flake.lock
          git commit -m "chore: update flake lock"
          git push
