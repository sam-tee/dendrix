name: Cache flake outputs

on:
  push:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

concurrency:
  group: cache-flake-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-cache:
    runs-on: native
    env:
      ATTIC_ENDPOINT: https://cache.akhlus.uk
      ATTIC_CACHE: dendrix
      ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
      GIT_SSH_COMMAND: "ssh -o StrictHostKeyChecking=accept-new"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH for private flake inputs
        run: |
          mkdir -p $HOME/.ssh
          echo "${{ secrets.GIT_SSH_KEY }}" >> $HOME/.ssh/git
          chmod 600 $HOME/.ssh/git
          cat <<EOF >$HOME/.ssh/config
          Host git-ssh.akhlus.uk
            IdentityFile ~/.ssh/git
            IdentitiesOnly yes
          EOF
          cat <<EOF >$HOME/.ssh/known_hosts
          [git-ssh.akhlus.uk]:2222 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIM4a7k8VW02CvP5IC7jLyKHz1jYJ27BZUFpgbk8l1o+L
          EOF

      - name: Update flake lock
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: nix flake update

      - name: Configure Attic
        run: |
          token="$(printf '%s' "$ATTIC_TOKEN" | tr -d '\r\n')"
          test -n "$token"

          attic login --set-default dendrix "$ATTIC_ENDPOINT" "$token"
          attic cache configure --public --retention-period "3 days" "$ATTIC_CACHE"
          attic use "$ATTIC_CACHE"

      - name: Build and push all flake packages
        run: |
          set -eu

          nix flake show --json --all-systems \
            | jq -r '
              .packages // {}
              | to_entries[]
              | .key as $system
              | .value
              | to_entries[]
              | select(.value.type == "derivation")
              | "\($system) \(.key)"
            ' > packages.txt

          if [ ! -s packages.txt ]; then
            echo "no packages"
            exit 0
          fi

          while read -r system package; do
            echo "building package $package for $system"
            out="$(
              nix build \
                --accept-flake-config \
                --print-build-logs \
                --no-link \
                --print-out-paths \
                ".#packages.${system}.${package}"
            )"

            echo "pushing package $package: $out"
            attic push "$ATTIC_CACHE" "$out"
          done < packages.txt

      - name: Build and push all NixOS configurations
        run: |
          set -eu

          configs="$(
            nix eval --json .#nixosConfigurations --apply builtins.attrNames \
              | jq -r '.[]'
          )"

          for host in $configs; do
            echo "building $host"
            out="$(
              nix build \
                --accept-flake-config \
                --print-build-logs \
                --no-link \
                --print-out-paths \
                ".#nixosConfigurations.${host}.config.system.build.toplevel"
            )"

            echo "pushing $host: $out"
            attic push "$ATTIC_CACHE" "$out"
          done

      - name: Commit updated lock file
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          set -eu

          if git diff --quiet -- flake.lock; then
            exit 0
          fi

          git config user.name "forgejo-actions"
          git config user.email "forgejo-actions@akhlus.uk"
          git add flake.lock
          git commit -m "chore: update flake lock"
          git push
