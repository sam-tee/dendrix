name: Cache flake outputs

on:
  push:
    branches:
      - main
      - "testing-*"
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: cache-flake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-cache:
    runs-on: native
    env:
      ATTIC_ENDPOINT: https://cache.samtee.party/
      ATTIC_CACHE: dendrix
      ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update flake lock
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: nix flake update

      - name: Update T3 Code nightly
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: nix shell nixpkgs#jq --command bash scripts/update-t3code-nightly.sh --repo "${{ github.workspace }}"

      - name: Configure Attic
        run: |
          token="$(printf '%s' "$ATTIC_TOKEN" | tr -d '\r\n')"
          test -n "$token"

          attic login --set-default "$ATTIC_CACHE" "$ATTIC_ENDPOINT" "$token"

      - name: Build and Cache Linux packages and systems
        run: |
          nix run github:mic92/nix-fast-build -- \
            --flake .#packages \
            --systems "x86_64-linux aarch64-linux" \
            --skip-cached \
            --attic-cache "$ATTIC_CACHE"

      - name: Update generated docs
        run: |
          bash scripts/update-services-docs.sh
          bash scripts/update-hosts-docs.sh
          if ! git diff --quiet -- docs/; then
            git config user.name "forgejo-actions"
            git config user.email "forgejo-actions@samtee.party"
            git add docs/
            git commit -m "chore: sync generated docs"
            git push
          fi

      - name: Commit lock file and nightly bump
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          set -eu

          if git diff --quiet -- flake.lock modules/packages/t3code-nightly.nix; then
            exit 0
          fi

          git config user.name "forgejo-actions"
          git config user.email "forgejo-actions@samtee.party"
          git add flake.lock modules/packages/t3code-nightly.nix
          git commit -m "chore: update flake lock and t3code nightly"
          git push

      - name: Release to servers
        if: github.ref == 'refs/heads/main'
        # Forced because the checkout is shallow; comin itself refuses to
        # deploy a commit behind the one it last deployed.
        run: git push --force origin HEAD:refs/heads/deploy

      - name: Send ntfy notification
        if: always()
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
        run: |
          status="${{ job.status }}"

          if [ "$EVENT" = "schedule" ] || [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$status" = "success" ]; then
              body="Updated lock file"
            else
              body="Lock file update"
            fi
          else
            body="${SHA:0:8} $(git log -1 --format=%s "$SHA" 2>/dev/null || true)"
          fi

          if [ "$status" = "success" ]; then
            title="Dendrix Cache Success"
            if [ "$REF" = "refs/heads/main" ]; then
              title="Dendrix Cached and Released"
            fi
            priority="default"
            tags="package,white_check_mark"
          else
            title="Dendrix Cache Failed ($EVENT)"
            priority="high"
            tags="warning,x"
          fi

          curl \
            -H "Title: $title" \
            -H "Priority: $priority" \
            -H "Tags: $tags" \
            -H "Click: $RUN_URL" \
            -d "$body" \
            "${{secrets.NTFY_URL}}"
