name: Calibre upstream watch

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: native
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check upstream piper-tts/calibre
        id: check
        run: bash scripts/check-calibre-upstream.sh

      - name: Send ntfy notification
        if: steps.check.outputs.moved == 'true' || steps.check.outputs.knob_gone == 'true'
        run: |
          if [ "${{ steps.check.outputs.knob_gone }}" = "true" ]; then
            title="Calibre override knob missing upstream"
            priority="urgent"
            body="A nixpkgs override knob (withTrain/speechSupport) disappeared upstream. The workaround in modules/gui/calibre.nix or modules/homelab/calibre-web.nix will break on the next flake update."
          else
            title="Calibre upstream moved, re-test workaround"
            priority="high"
            body="Upstream piper-tts=${{ steps.check.outputs.upstream_piper }} calibre=${{ steps.check.outputs.upstream_calibre }}. Re-test a vanilla aarch64-linux build; remove the workaround if green, else bump KNOWN_BROKEN_* in scripts/check-calibre-upstream.sh."
          fi

          curl \
            -H "Title: $title" \
            -H "Priority: $priority" \
            -H "Tags: package,warning" \
            -d "$body" \
            "${{secrets.NTFY_URL}}"
